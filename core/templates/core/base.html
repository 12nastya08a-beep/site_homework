{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ФПРН НаУКМА{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #FBF9F1;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            color: #111111;
            line-height: 1.75;
        }
        .navbar {
            background: linear-gradient(135deg, #38bdf8, #0284c7) !important;
            box-shadow: 0 4px 20px rgba(2, 132, 199, 0.2);
            transition: all 0.3s ease;
        }
        .navbar-brand {
            letter-spacing: 1px;
            font-weight: 700 !important;
        }
        .navbar-brand, .nav-link {
            color: #ffffff !important;
            font-weight: 500;
        }
        .nav-link {
            transition: all 0.2s ease;
            border-radius: 8px;
            padding: 0.5rem 1rem !important;
        }
        .nav-link:hover {
            color: #ffffff !important;
            background-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }
        main.container {
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.06);
            padding: 3rem;
            margin-top: 2.5rem;
            margin-bottom: 3rem;
            border: 1px solid #f3ede2;
            transition: transform 0.3s ease;
        }
        h1, h2, h3, h4, h5 {
            color: #0f172a;
            font-weight: 700;
            margin-bottom: 1.2rem;
        }
        p, li {
            color: #1a1a1a;
            font-size: 1.05rem;
        }
        footer {
            background-color: #ffffff;
            border-top: 1px solid #f3ede2;
            padding: 1.5rem 0;
            color: #475569;
            text-align: center;
            margin-top: auto;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg py-3">
        <div class="container">
            <a class="navbar-brand fs-4" href="{% url 'home' %}">🌿 ФПРН НаУКМА</a>
            <button class="navbar-toggler border-0 text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto gap-2">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'home' %}">Головна</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'department_list' %}">Кафедри</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'program_list' %}">Спеціальності</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container pb-5">
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <div class="container">
            <small>&copy; 2026 Факультет природничих наук Національного університету «Києво-Могилянська академія»</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
